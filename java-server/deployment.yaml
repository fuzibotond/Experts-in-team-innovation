apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-server
  labels:
    app: java-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-server
  template:
    metadata:
      labels:
        app: java-server
    spec:
      containers:
        - name: java-server
          image: gcr.io/expert-in-teams/java-server:latest
          ports:
            - containerPort: 8085
          env:
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                configMapKeyRef: # Use ConfigMap instead of Secret
                  name: app-config
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                configMapKeyRef: # Use ConfigMap instead of Secret
                  name: app-config
                  key: GOOGLE_CLIENT_SECRET
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: FRONTEND_URL
            - name: KAFKA_BOOTSTRAP_SERVER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_BOOTSTRAP_SERVER
